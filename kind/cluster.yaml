# Local cluster: 1 control plane + 2 workers so replicas can spread across nodes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: car-rental
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # app NodePort -> http://localhost:8080
        hostPort: 8080
      - containerPort: 30443   # Argo CD UI NodePort -> https://localhost:8443
        hostPort: 8443
      - containerPort: 30300   # Grafana NodePort -> http://localhost:3000
        hostPort: 3000
  - role: worker
  - role: worker
