# Local alert receiver: Alertmanager POSTs notifications here (webhook) and it prints
# one readable line per alert. Stands in for Slack/PagerDuty on a laptop cluster.
# View deliveries: kubectl -n monitoring logs deploy/alert-receiver -f
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: monitoring
data:
  receiver.py: |
    import json, sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))))
            channel = self.path.strip("/") or "default"
            for a in body.get("alerts", []):
                labels, notes = a.get("labels", {}), a.get("annotations", {})
                print(f"[{channel}] {a.get('status', '?').upper():8} {labels.get('severity', '-'):8} "
                      f"{labels.get('alertname')} | {notes.get('summary', '')} | "
                      f"startsAt={a.get('startsAt')} endsAt={a.get('endsAt')} | runbook: {notes.get('runbook', '-')}",
                      flush=True)
            self.send_response(200)
            self.end_headers()

        def do_GET(self):  # health check
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):  # silence per-request access logs
            pass

    print("alert-receiver listening on :8080", flush=True)
    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels: { app.kubernetes.io/name: alert-receiver }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alert-receiver }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alert-receiver }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: receiver
          image: python:3.13-alpine3.23
          command: ["python", "-u", "/app/receiver.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: alert-receiver }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: alert-receiver }
  ports:
    - { name: http, port: 8080, targetPort: http }
