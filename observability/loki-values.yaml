# Loki (chart grafana/loki) in single-binary mode: one pod, local filesystem storage.
# Enough for a laptop cluster; production would run simple-scalable mode on object storage.
deploymentMode: SingleBinary

loki:
  auth_enabled: false          # single tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb            # tsdb + v13 is required for structured metadata (trace_id)
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    retention_period: 72h      # same as Prometheus retention
    allow_structured_metadata: true
    volume_enabled: true       # log-volume histogram in Grafana Explore (off by default)
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# Not needed for a single binary on a laptop
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
