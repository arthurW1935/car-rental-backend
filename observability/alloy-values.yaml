# Grafana Alloy (chart grafana/alloy) as the log collector.
# A single Deployment that tails pod logs through the Kubernetes API (loki.source.kubernetes):
# no DaemonSet, no hostPath mounts of /var/log on the nodes.
controller:
  type: deployment
  replicas: 1   # more replicas would ship every log line more than once

alloy:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  configMap:
    content: |-
      // 1. Find every pod in the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Turn pod metadata into a few low-cardinality Loki labels.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // Git SHA of the release: lets you compare logs before/after a deploy.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_version"]
          target_label  = "version"
        }
      }

      // 3. Tail the logs through the Kubernetes API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.app.receiver]
      }

      // 4. App logs: join stack traces into one entry, label the level, and keep the
      //    trace/span ids as structured metadata (not labels: unique per request).
      loki.process "app" {
        stage.match {
          selector = `{app="car-rental-backend", container="app"}`

          stage.multiline {
            firstline     = `^\d{4}-\d{2}-\d{2}T`
            max_wait_time = "3s"
          }
          stage.regex {
            expression = `^\S+\s+(?P<level>[A-Z]+)\s+\[[^\]]*\]\s+\[trace=(?P<trace_id>[0-9a-f]*) span=(?P<span_id>[0-9a-f]*)\]`
          }
          stage.labels {
            values = { level = "" }
          }
          stage.structured_metadata {
            values = { trace_id = "", span_id = "" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // 5. Ship to Loki.
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring:3100/loki/api/v1/push"
        }
      }
