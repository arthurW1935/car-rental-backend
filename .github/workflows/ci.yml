name: CI

on:
  push:
    branches: [main, devops]
    paths-ignore: ["**.md", "docs/**", "deploy/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "deploy/**"]
  workflow_dispatch:

# Least privilege by default; jobs ask for more only where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/arthurw1935/car-rental-backend

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit + API integration tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: target/surefire-reports/

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint helm/car-rental
      - run: helm template ci helm/car-rental -f deploy/values-kind.yaml > /dev/null

  image:
    name: Image build, scan, smoke test, push
    needs: [test, secret-scan, chart-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy) - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore   # documented, expiring risk acceptances
          exit-code: "1"
          format: table

      # Prove the exact image deploys and serves a real request before it is published.
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ci
      - name: Deploy chart to kind and smoke test
        run: |
          kind load docker-image "$IMAGE:$GITHUB_SHA" --name ci
          ./scripts/bootstrap.sh
          helm install car-rental helm/car-rental -n car-rental \
            --set image.tag="$GITHUB_SHA" --set app.service.type=ClusterIP --wait --timeout 5m
          kubectl -n car-rental port-forward svc/car-rental-app 8080:80 &
          sleep 5
          curl -sf -XPOST localhost:8080/customers -H 'content-type: application/json' \
            -d '{"name":"CI","phone":"1","mail":"ci@example.com","address":"runner"}'
          curl -sf localhost:8080/actuator/info | tee /dev/stderr | grep -q "$GITHUB_SHA"
      - name: Dump cluster state on failure
        if: failure()
        run: kubectl -n car-rental get pods -o wide; kubectl -n car-rental logs -l app.kubernetes.io/name=car-rental-backend --tail=100 --all-containers

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:$GITHUB_SHA"
