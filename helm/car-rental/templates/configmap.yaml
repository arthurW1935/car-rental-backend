apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-app
  labels: {{- include "car-rental.labels" . | nindent 4 }}
data:
  DB_URL: "jdbc:mysql://{{ include "car-rental.mysql.host" . }}:3306/{{ .Values.mysql.database }}"
  DB_USERNAME: {{ .Values.mysql.user | quote }}
  {{- range $k, $v := .Values.app.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
