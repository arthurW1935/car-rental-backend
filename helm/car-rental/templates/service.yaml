apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "car-rental.labels" . | nindent 4 }}
    {{- include "car-rental.app.selector" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector: {{- include "car-rental.app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if eq .Values.app.service.type "NodePort" }}
      nodePort: {{ .Values.app.service.nodePort }}
      {{- end }}
