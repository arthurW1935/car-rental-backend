# MySQL as a single-replica StatefulSet: stable identity + its own persistent volume.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "car-rental.mysql.host" . }}
  labels:
    {{- include "car-rental.labels" . | nindent 4 }}
    {{- include "car-rental.mysql.selector" . | nindent 4 }}
spec:
  clusterIP: None   # headless: stable DNS for the StatefulSet pod
  selector: {{- include "car-rental.mysql.selector" . | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "car-rental.mysql.host" . }}
  labels:
    {{- include "car-rental.labels" . | nindent 4 }}
    {{- include "car-rental.mysql.selector" . | nindent 4 }}
spec:
  serviceName: {{ include "car-rental.mysql.host" . }}
  replicas: 1
  selector:
    matchLabels: {{- include "car-rental.mysql.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "car-rental.mysql.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: mysql-password }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: mysql-root-password }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" --silent"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: mysql }
            initialDelaySeconds: 60
            periodSeconds: 10
          resources: {{- toYaml .Values.mysql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run, mountPath: /var/run/mysqld }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
