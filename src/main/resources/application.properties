spring.application.name=car-rental-backend

# Database: all connection details come from the environment (no secrets in the repo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:5050/car_rental_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Graceful shutdown so rolling updates drain in-flight requests
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: health probes, Prometheus metrics, build/version info
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
info.app.version=${APP_VERSION:dev}

# Logging: stdout only, the platform collects it
logging.level.root=INFO
logging.level.com.group9.carrentalbackend=INFO
